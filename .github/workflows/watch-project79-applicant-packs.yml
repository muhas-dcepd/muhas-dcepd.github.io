name: Send Project 79 Course Director Applicant Packs

on:
  schedule:
    - cron: '15 2 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build packs and QC without sending email or updating state
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: dcepd-project79-applicant-packs
  cancel-in-progress: false

jobs:
  applicant-packs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install applicant-pack dependencies
        run: python -m pip install --disable-pip-version-check requests openpyxl

      - name: Build and send Course Director Applicant Packs
        env:
          REDCAP_PROJECT75_TOKEN: ${{ secrets.REDCAP_PROJECT75_TOKEN }}
          REDCAP_PROJECT79_TOKEN: ${{ secrets.REDCAP_PROJECT79_TOKEN }}
          DCEPD_EMAIL_1: ${{ secrets.DCEPD_EMAIL_1 }}
          DCEPD_EMAIL_2: ${{ secrets.DCEPD_EMAIL_2 }}
          DCEPD_EMAIL_3: ${{ secrets.DCEPD_EMAIL_3 }}
          DCEPD_EMAIL_4: ${{ secrets.DCEPD_EMAIL_4 }}
          DCEPD_SMTP_HOST: ${{ secrets.DCEPD_SMTP_HOST }}
          DCEPD_SMTP_PORT: ${{ secrets.DCEPD_SMTP_PORT }}
          DCEPD_SMTP_USERNAME: ${{ secrets.DCEPD_SMTP_USERNAME }}
          DCEPD_SMTP_PASSWORD: ${{ secrets.DCEPD_SMTP_PASSWORD }}
          TZ: Africa/Dar_es_Salaam
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.dry_run }}" == "true" ]]; then
            args+=(--dry-run)
          fi
          python scripts/process_project79_applicant_packs.py "${args[@]}"

      - name: Upload Applicant Pack audit/QC
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dcepd-applicant-packs-${{ github.run_id }}
          path: .applicant-pack-output
          if-no-files-found: warn
          retention-days: 90

      - name: Save successful Applicant Pack state
        if: success() && (github.event_name == 'schedule' || inputs.dry_run == false)
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- automation/applicant-pack-state.json; then
            echo "Applicant Pack state unchanged."
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add automation/applicant-pack-state.json
          git commit -m 'Update DCEPD applicant-pack delivery state'

          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            echo "State push attempt ${attempt} failed; retrying."
            sleep $((attempt * 3))
          done

          echo "Could not persist Applicant Pack state after sending. Review this run before the next scheduled send."
          exit 1
