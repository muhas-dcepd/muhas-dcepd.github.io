name: Applicant Pack Pilot Offline Tests

on:
  push:
    branches:
      - 'pilot/applicant-pack-selection-fields-20261030'
  pull_request:
    paths:
      - 'scripts/process_project79_applicant_packs.py'
      - 'tests/test_applicant_pack_pilot.py'
      - '.github/workflows/test-applicant-pack-pilot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline dependencies
        run: python -m pip install --disable-pip-version-check requests openpyxl
      - name: Compile applicant-pack generator
        run: python -m py_compile scripts/process_project79_applicant_packs.py
      - name: Run synthetic offline tests without REDCap or SMTP credentials
        env:
          REDCAP_PROJECT75_TOKEN: offline
          REDCAP_PROJECT79_TOKEN: offline
        run: python -m unittest discover -s tests -p test_applicant_pack_pilot.py -v
