name: Watch DCEPD accreditation requests

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: dcepd-accreditation-listener
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install lightweight listener dependencies
        run: python -m pip install --disable-pip-version-check requests reportlab

      - name: Check and claim pending REDCap accreditation request
        id: claim
        env:
          REDCAP_PROJECT75_TOKEN: ${{ secrets.REDCAP_PROJECT75_TOKEN }}
          TZ: Africa/Dar_es_Salaam
        shell: bash
        run: |
          set -euo pipefail
          output="$(python scripts/process_accreditation_batch.py claim)"
          echo "$output"
          while IFS= read -r line; do
            if [[ "$line" == *=* ]]; then
              echo "$line" >> "$GITHUB_OUTPUT"
            fi
          done <<< "$output"

      - uses: r-lib/actions/setup-r@v2
        if: steps.claim.outputs.has_request == 'true'
        with:
          r-version: 'release'

      - name: Install system dependency for R curl
        if: steps.claim.outputs.has_request == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev

      - name: Install R dependencies for Project 75 sync
        if: steps.claim.outputs.has_request == 'true'
        run: |
          Rscript -e 'install.packages(c("httr","readr","dplyr","stringr","lubridate","jsonlite","tibble"), repos="https://cloud.r-project.org")'

      - name: Unpack verified Project 75 runtime
        if: steps.claim.outputs.has_request == 'true'
        run: |
          rm -rf .project75-runtime
          mkdir -p .project75-runtime
          cat \
            automation/project75-v2.2.12-runtime.b64.part00 \
            automation/project75-v2.2.12-runtime.b64.part01 \
            automation/project75-v2.2.12-runtime.b64.part02 \
            automation/project75-v2.2.12-runtime.b64.part03 \
            automation/project75-v2.2.12-runtime.b64.part04a \
            automation/project75-v2.2.12-runtime.b64.part04b \
            | base64 -d > /tmp/project75-v2.2.12-runtime.zip
          echo "3074e99682a3a1d338053e24f7c409ebaa6d47f5ea0acd4085d5286ee0c82a49  /tmp/project75-v2.2.12-runtime.zip" | sha256sum -c -
          unzip -q /tmp/project75-v2.2.12-runtime.zip -d .project75-runtime

      - name: Apply Project 75 V2.2.13 APC compatibility patch
        if: steps.claim.outputs.has_request == 'true'
        run: |
          cp automation/project75-v2.2.13-patch/config.R .project75-runtime/config/config.R
          cp automation/project75-v2.2.13-patch/00_utils.R .project75-runtime/R/00_utils.R
          cp automation/project75-v2.2.13-patch/03_derive_project75.R .project75-runtime/R/03_derive_project75.R

      - name: Run verified Project 75 refresh for accreditation batch
        if: steps.claim.outputs.has_request == 'true'
        working-directory: .project75-runtime
        env:
          REDCAP_PROJECT75_TOKEN: ${{ secrets.REDCAP_PROJECT75_TOKEN }}
          REDCAP_PROJECT79_TOKEN: ${{ secrets.REDCAP_PROJECT79_TOKEN }}
          DCEPD_DRY_RUN: 'false'
          TZ: Africa/Dar_es_Salaam
        run: Rscript project75_refresh_v2_2.R

      - name: Finalize accreditation letters and package
        if: steps.claim.outputs.has_request == 'true'
        env:
          REDCAP_PROJECT75_TOKEN: ${{ secrets.REDCAP_PROJECT75_TOKEN }}
          TZ: Africa/Dar_es_Salaam
          DCEPD_EMAIL_1: ${{ secrets.DCEPD_EMAIL_1 }}
          DCEPD_EMAIL_2: ${{ secrets.DCEPD_EMAIL_2 }}
          DCEPD_EMAIL_3: ${{ secrets.DCEPD_EMAIL_3 }}
          DCEPD_EMAIL_4: ${{ secrets.DCEPD_EMAIL_4 }}
          DCEPD_SMTP_HOST: ${{ secrets.DCEPD_SMTP_HOST }}
          DCEPD_SMTP_PORT: ${{ secrets.DCEPD_SMTP_PORT }}
          DCEPD_SMTP_USERNAME: ${{ secrets.DCEPD_SMTP_USERNAME }}
          DCEPD_SMTP_PASSWORD: ${{ secrets.DCEPD_SMTP_PASSWORD }}
        run: python scripts/process_accreditation_batch.py finalize

      - name: Upload accreditation batch package
        if: steps.claim.outputs.has_request == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dcepd-accreditation-${{ github.run_id }}
          path: .project75-runtime/accreditation
          if-no-files-found: error
          retention-days: 180

      - name: Refresh public catalogue and aggregate dashboard
        if: steps.claim.outputs.has_request == 'true'
        env:
          REDCAP_PROJECT75_TOKEN: ${{ secrets.REDCAP_PROJECT75_TOKEN }}
          REDCAP_PROJECT79_TOKEN: ${{ secrets.REDCAP_PROJECT79_TOKEN }}
        run: |
          python scripts/update_dcepd_catalogue.py
          python scripts/build_dcepd_dashboard.py

      - name: Build DCEPD management reporting packet
        if: steps.claim.outputs.has_request == 'true'
        run: |
          python scripts/build_dcepd_management_packet.py \
            --runtime .project75-runtime \
            --catalogue dcepd-courses/catalogue.json

      - name: Upload Project 75 and management audit
        if: steps.claim.outputs.has_request == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dcepd-accreditation-audit-${{ github.run_id }}
          path: |
            .project75-runtime/output
            .project75-runtime/logs
            .project75-runtime/archive
            .project75-runtime/management
          if-no-files-found: warn
          retention-days: 180

      - name: Validate and update search metadata
        if: steps.claim.outputs.has_request == 'true'
        run: |
          python -m unittest discover -s tests -p 'test_dcepd*.py'
          python scripts/build_site_seo.py

      - name: Save successful public refresh
        if: steps.claim.outputs.has_request == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html dcepd-courses/index.html dcepd-courses/catalogue.json dcepd-courses/courses dcepd-dashboard/index.html dcepd-dashboard/summary.json robots.txt sitemap.xml
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh DCEPD after accreditation batch'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Stage public website
        if: steps.claim.outputs.has_request == 'true'
        run: python scripts/stage_dcepd_site.py

      - uses: actions/configure-pages@v5
        if: steps.claim.outputs.has_request == 'true'

      - uses: actions/upload-pages-artifact@v4
        if: steps.claim.outputs.has_request == 'true'
        with:
          path: _site

      - name: Mark claimed request failed if processing failed
        if: failure() && steps.claim.outputs.has_request == 'true'
        env:
          REDCAP_PROJECT75_TOKEN: ${{ secrets.REDCAP_PROJECT75_TOKEN }}
          TZ: Africa/Dar_es_Salaam
          APC_FAILURE_REASON: GitHub accreditation workflow failed after the request was claimed. Review the workflow log and submit a new repeat instance to retry.
        run: python scripts/process_accreditation_batch.py fail

  deploy:
    needs: process
    if: needs.process.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy DCEPD website
        id: deployment
        uses: actions/deploy-pages@v4
