name: One-time Project 75 suspect fee cleanup

on:
  workflow_dispatch:
    inputs:
      execute:
        description: "Actually clear eligible suspect fees"
        required: true
        type: boolean
        default: false
      confirmation:
        description: "For live execution type exactly CLEAR-142-FEES"
        required: false
        type: string

permissions:
  contents: read

jobs:
  fee-cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Install dependency
        run: python -m pip install requests
      - name: Preflight or execute approved fee cleanup
        env:
          REDCAP_PROJECT75_TOKEN: ${{ secrets.REDCAP_PROJECT75_TOKEN }}
          EXECUTE: ${{ inputs.execute }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [ "$EXECUTE" = "true" ]; then
            if [ "$CONFIRMATION" != "CLEAR-142-FEES" ]; then
              echo "Live execution blocked: confirmation phrase does not match."
              exit 1
            fi
            python scripts/clear_project75_suspect_fees.py --execute
          else
            python scripts/clear_project75_suspect_fees.py
          fi
      - name: Upload audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project75-suspect-fee-cleanup-audit
          path: .fee-clear-output
          if-no-files-found: warn
