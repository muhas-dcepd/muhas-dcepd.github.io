name: Refresh and deploy MUHAS DCEPD

on:
  push:
    branches: [main]
    paths-ignore:
      - 'automation/applicant-pack-state.json'
  workflow_dispatch:
    inputs:
      refresh_api:
        description: Refresh both REDCap feeds before publishing
        type: boolean
        default: true
      send_weekly_report:
        description: Send the private DCEPD weekly management workbook after a verified refresh
        type: boolean
        default: false
  schedule:
    - cron: '37 1 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: dcepd-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - uses: r-lib/actions/setup-r@v2
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh_api)
        with:
          r-version: 'release'

      - name: Install system dependency for R curl
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh_api)
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev

      - name: Install R dependencies for Project 75 sync
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh_api)
        run: |
          Rscript -e 'install.packages(c("httr","readr","dplyr","stringr","lubridate","jsonlite","tibble"), repos="https://cloud.r-project.org")'

      - name: Unpack verified Project 75 base runtime
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh_api)
        run: |
          rm -rf .project75-runtime
          mkdir -p .project75-runtime
          cat \
            automation/project75-v2.2.12-runtime.b64.part00 \
            automation/project75-v2.2.12-runtime.b64.part01 \
            automation/project75-v2.2.12-runtime.b64.part02 \
            automation/project75-v2.2.12-runtime.b64.part03 \
            automation/project75-v2.2.12-runtime.b64.part04a \
            automation/project75-v2.2.12-runtime.b64.part04b \
            | base64 -d > /tmp/project75-v2.2.12-runtime.zip
          echo "3074e99682a3a1d338053e24f7c409ebaa6d47f5ea0acd4085d5286ee0c82a49  /tmp/project75-v2.2.12-runtime.zip" | sha256sum -c -
          unzip -q /tmp/project75-v2.2.12-runtime.zip -d .project75-runtime

      - name: Apply Project 75 V2.2.13 APC compatibility patch
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh_api)
        run: |
          cp automation/project75-v2.2.13-patch/config.R .project75-runtime/config/config.R
          cp automation/project75-v2.2.13-patch/00_utils.R .project75-runtime/R/00_utils.R
          cp automation/project75-v2.2.13-patch/03_derive_project75.R .project75-runtime/R/03_derive_project75.R

      - name: Sync and verify Project 75 derived record fields
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh_api)
        working-directory: .project75-runtime
        env:
          REDCAP_PROJECT75_TOKEN: ${{ secrets.REDCAP_PROJECT75_TOKEN }}
          REDCAP_PROJECT79_TOKEN: ${{ secrets.REDCAP_PROJECT79_TOKEN }}
          DCEPD_DRY_RUN: 'false'
          TZ: Africa/Dar_es_Salaam
        run: Rscript project75_refresh_v2_2.R

      - name: Promote verified Project 79 course crosswalk
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh_api)
        shell: bash
        run: |
          set -euo pipefail
          crosswalk="$(find .project75-runtime/archive/verified -type f -name 'project79_course_crosswalk_verified.csv' | sort | tail -n 1)"
          test -n "$crosswalk"
          cp "$crosswalk" automation/project79-course-crosswalk.csv

      - name: Upload Project 75 sync audit artifact
        if: always() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh_api))
        uses: actions/upload-artifact@v4
        with:
          name: project75-sync-${{ github.run_id }}
          path: |
            .project75-runtime/output
            .project75-runtime/logs
            .project75-runtime/archive
          if-no-files-found: warn
          retention-days: 90

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Refresh public catalogue and aggregate dashboard
        if: github.event_name != 'workflow_dispatch' || inputs.refresh_api
        env:
          REDCAP_PROJECT75_TOKEN: ${{ secrets.REDCAP_PROJECT75_TOKEN }}
          REDCAP_PROJECT79_TOKEN: ${{ secrets.REDCAP_PROJECT79_TOKEN }}
        run: |
          python scripts/update_dcepd_catalogue.py
          python scripts/build_dcepd_dashboard.py

      - name: Build Project 79 course-choice QC
        if: github.event_name != 'workflow_dispatch' || inputs.refresh_api
        continue-on-error: true
        env:
          REDCAP_PROJECT75_TOKEN: ${{ secrets.REDCAP_PROJECT75_TOKEN }}
          REDCAP_PROJECT79_TOKEN: ${{ secrets.REDCAP_PROJECT79_TOKEN }}
        run: python scripts/build_project79_course_choice_qc.py

      - name: Upload Project 79 course-choice QC
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project79-course-choice-qc-${{ github.run_id }}
          path: project79-choice-qc
          if-no-files-found: warn
          retention-days: 90

      - name: Build DCEPD management reporting packet
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh_api)
        run: |
          python scripts/build_dcepd_management_packet.py \
            --runtime .project75-runtime \
            --catalogue dcepd-courses/catalogue.json

      - name: Build private weekly management workbook
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh_api)
        env:
          REDCAP_PROJECT75_TOKEN: ${{ secrets.REDCAP_PROJECT75_TOKEN }}
          TZ: Africa/Dar_es_Salaam
        run: |
          python -m pip install --disable-pip-version-check openpyxl
          python scripts/build_and_send_dcepd_weekly_report.py

      - name: Send Friday DCEPD management report
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh_api && inputs.send_weekly_report)
        continue-on-error: true
        env:
          REDCAP_PROJECT75_TOKEN: ${{ secrets.REDCAP_PROJECT75_TOKEN }}
          DCEPD_EMAIL_1: ${{ secrets.DCEPD_EMAIL_1 }}
          DCEPD_EMAIL_2: ${{ secrets.DCEPD_EMAIL_2 }}
          DCEPD_EMAIL_3: ${{ secrets.DCEPD_EMAIL_3 }}
          DCEPD_EMAIL_4: ${{ secrets.DCEPD_EMAIL_4 }}
          DCEPD_SMTP_HOST: ${{ secrets.DCEPD_SMTP_HOST }}
          DCEPD_SMTP_PORT: ${{ secrets.DCEPD_SMTP_PORT }}
          DCEPD_SMTP_USERNAME: ${{ secrets.DCEPD_SMTP_USERNAME }}
          DCEPD_SMTP_PASSWORD: ${{ secrets.DCEPD_SMTP_PASSWORD }}
          TZ: Africa/Dar_es_Salaam
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "schedule" && "$(TZ=Africa/Dar_es_Salaam date +%u)" != "5" ]]; then
            echo "Not Friday in Africa/Dar_es_Salaam; weekly email skipped."
            exit 0
          fi
          python scripts/build_and_send_dcepd_weekly_report.py --send

      - name: Upload DCEPD management reporting packet
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh_api)
        uses: actions/upload-artifact@v4
        with:
          name: dcepd-management-${{ github.run_id }}
          path: .project75-runtime/management
          if-no-files-found: error
          retention-days: 90

      - name: Validate and update search metadata
        run: |
          python -m unittest discover -s tests -p 'test_dcepd*.py'
          python scripts/build_site_seo.py

      - name: Save successful public refresh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html dcepd-courses/index.html dcepd-courses/catalogue.json dcepd-courses/courses dcepd-dashboard/index.html dcepd-dashboard/summary.json automation/project79-course-crosswalk.csv robots.txt sitemap.xml
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh public DCEPD catalogue and activity dashboard'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Stage public website
        run: python scripts/stage_dcepd_site.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy DCEPD website
        id: deployment
        uses: actions/deploy-pages@v4
