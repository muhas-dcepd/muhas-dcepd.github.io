name: Watch Project 75 course runs

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: dcepd-pages
  cancel-in-progress: false

jobs:
  refresh-run-ux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Check Project 75/79 and refresh run-aware UX
        env:
          REDCAP_PROJECT75_TOKEN: ${{ secrets.REDCAP_PROJECT75_TOKEN }}
          REDCAP_PROJECT79_TOKEN: ${{ secrets.REDCAP_PROJECT79_TOKEN }}
        run: |
          python scripts/update_dcepd_catalogue.py
          python scripts/build_dcepd_dashboard.py
          python scripts/build_site_seo.py

      - name: Save changed public catalogue/dashboard
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html dcepd-courses/index.html dcepd-courses/catalogue.json dcepd-courses/courses dcepd-dashboard/index.html dcepd-dashboard/summary.json robots.txt sitemap.xml
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh DCEPD run-aware catalogue UX'
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "No public run/catalogue changes detected."
          fi

      - name: Stage public website
        run: python scripts/stage_dcepd_site.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: refresh-run-ux
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy DCEPD website
        id: deployment
        uses: actions/deploy-pages@v4
